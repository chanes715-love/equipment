<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>設備借用系統</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root { 
      --primary: #128c7e; /* 湖水綠 (主色調) */
      --primary-light: #20b2aa;
      --bg: #e0f7fa; /* 淺天空藍背景 */
      --container-bg: #ffffff;
      --text-dark: #0f5132;
      --success: #27ae60; 
      --danger: #e74c3c; 
      --past: #dcdde1; 
      --gray: #95a5a6; 
      --admin-purple: #00796b; 
      --admin-bg: #e0f2f1;     
    }
    
    body { 
      font-family: 'Nunito', 'Microsoft JhengHei', sans-serif; 
      background-color: var(--bg); 
      margin: 0; 
      padding: 0; 
      font-size: 11pt; 
      color: #333; 
      overflow-x: hidden;
    }

    h1, h2, h3, .app-title { font-family: 'Fredoka', 'Microsoft JhengHei', sans-serif; color: var(--text-dark); }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    .bg-illustration {
      position: fixed;
      opacity: 0.85;
      z-index: 0;
      animation: float 6s ease-in-out infinite;
      pointer-events: none;
    }
    
    .app-wrapper {
      position: relative;
      max-width: 1000px;
      margin: 30px auto;
      z-index: 10;
      filter: drop-shadow(0 15px 30px rgba(18, 140, 126, 0.2)); 
    }

    .wavy-top {
      width: 100%;
      height: 60px;
      background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1440 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path fill="%23ffffff" d="M0,60 Q120,0 240,60 T480,60 T720,60 T960,60 T1200,60 T1440,60 L1440,100 L0,100 Z"></path></svg>') no-repeat bottom;
      background-size: 100% 60px;
    }

    .wavy-bottom {
      width: 100%;
      height: 45px;
      background-color: #e59866;
      background-image: repeating-linear-gradient(15deg, transparent, transparent 10px, rgba(0,0,0,0.04) 10px, rgba(0,0,0,0.04) 20px), repeating-linear-gradient(-15deg, transparent, transparent 15px, rgba(0,0,0,0.02) 15px, rgba(0,0,0,0.02) 30px);
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    .main-content {
      background-color: var(--container-bg);
      padding: 10px 40px 40px 40px;
    }

    @media (max-width: 768px) {
      .app-wrapper { margin: 10px auto; }
      .main-content { padding: 10px 20px 30px 20px; }
      .bg-illustration { display: none; }
    }

    .app-header { 
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; 
      margin-bottom: 25px; border-bottom: 3px dashed #e0f2f1; padding-bottom: 15px;
    }
    .app-title { font-size: 2.2rem; margin: 0; color: var(--primary); letter-spacing: 1px; }
    
    .app-nav { display: flex; gap: 10px; flex-grow: 1; justify-content: center; overflow-x: auto; white-space: nowrap; margin-top: 10px;}
    .nav-item { padding: 10px 20px; cursor: pointer; font-weight: 700; color: #777; background: #f0f7f4; border-radius: 30px; transition: 0.3s; font-size: 11pt; border: 2px solid transparent;}
    .nav-item:hover { background: #e0f2f1; transform: translateY(-2px); }
    .nav-item.active { background: var(--primary); color: white; border-color: var(--primary-light); box-shadow: 0 4px 10px rgba(18, 140, 126, 0.4); }
    .nav-item.admin-nav { background: #f5f5f5; color: var(--admin-purple); display: none; }
    .nav-item.admin-nav.active { background: var(--admin-purple); color: white; border-color: var(--admin-purple); }

    .header-user { font-size: 11pt; color: #fff; background: var(--primary-light); padding: 8px 16px; border-radius: 20px; display: flex; align-items: center; gap: 10px; font-weight: 700;}
    .btn-logout { background: #ffccbc; border: 1px solid #ffab91; color: #d84315; font-weight: bold; cursor: pointer; padding: 4px 10px; border-radius: 15px; font-size: 10pt; transition: 0.2s;}
    .btn-logout:hover { background: #ffab91; }

    .view-section { display: none; animation: fadeIn 0.4s ease; }
    .view-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .booking-controls { display:grid; grid-template-columns: 1fr 1fr; gap:15px; background:var(--bg); padding:20px; border-radius:15px; margin-bottom:20px; border: 2px solid #b2ebf2; }
    .booking-controls label { font-weight: 700; color: var(--primary); font-size: 11pt; }
    .booking-controls input, .booking-controls select { width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #b2ebf2; margin-top: 8px; box-sizing: border-box; font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 11pt; color: var(--primary); }
    
    .locked-input { opacity: 0.7; cursor: not-allowed !important; background-color: #eef2f5 !important; }
    .proxy-alert { display:none; background: #fff9c4; color:#f57f17; padding:15px; border-radius:12px; margin-bottom:20px; font-weight:bold; align-items: center; gap: 10px; border: 2px dashed #fbc02d; }
    
    .daily-board { background: #f1f8e9; border: 2px dashed #aed581; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
    .daily-board h3 { margin: 0 0 15px 0; color: #558b2f; font-size: 13pt; }
    .daily-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .daily-tag { background: white; border: 2px solid #8bc34a; color: #33691e; padding: 6px 12px; border-radius: 20px; font-size: 10pt; font-weight: bold; }

    table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 15px; table-layout: fixed; background: white; border-radius: 12px; overflow: hidden; border: 2px solid #e0f2f1; }
    th, td { padding: 15px 8px; text-align: center; border-bottom: 1px solid #e0f2f1; border-right: 1px solid #e0f2f1; }
    th { background: #e0f7fa; color: var(--primary); line-height: 1.4; font-weight: 700; font-size: 12pt; border-bottom: 2px solid #b2ebf2; } 
    th:last-child, td:last-child { border-right: none; }
    tr:last-child td { border-bottom: none; }

    .skeleton { background: linear-gradient(110deg, #ececec 8%, #f5f5f5 18%, #ececec 33%); background-size: 200% 100%; animation: 1.5s shine linear infinite; border-radius:8px; height: 35px; }
    @keyframes shine { to { background-position-x: -200%; } }
    
    .btn-book { background: var(--success); color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; width: 90%; font-weight: bold; transition: 0.2s; }
    .btn-book:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .cell-mine { color: white; font-weight: bold; background: var(--primary); padding: 6px; border: 2px solid var(--primary-light); width: 90%; display:inline-block; border-radius: 8px; }
    .cell-booked { color: #fff; font-weight: bold; background: var(--danger); padding: 6px; width: 90%; display:inline-block; border-radius: 8px; }
    .cell-past { background: var(--past); color: #777; border-radius: 8px; padding: 6px; display: inline-block; width: 90%; font-weight: 600;}
    .cell-restricted { color: #888; font-size: 10pt; background: #f5f5f5; font-weight: 600; border-radius: 8px; padding: 6px; }

    .admin-panel { background: var(--admin-bg); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 2px dashed #80cbc4; }
    .admin-input { flex-grow: 1; padding: 12px; border-radius: 8px; border: 2px solid #80cbc4; font-size: 11pt; }
    .btn-admin-active { background: var(--admin-purple); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn-admin-inactive { background: white; color: var(--admin-purple); border: 2px solid var(--admin-purple); padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; }

    .tabs { display: flex; gap: 15px; margin-bottom: 25px; border-bottom: 3px solid #e0f2f1; padding-bottom: 15px; }
    .tab { padding: 10px 25px; cursor: pointer; border-radius: 30px; font-weight: 700; color: #94a3b8; background: #f8fafc; border: 2px solid #e2e8f0; transition: 0.3s; }
    .tab.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    .card { border-left: 8px solid var(--primary-light); background: #fff; padding: 20px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); display: flex; justify-content: space-between; align-items: center; border: 1px solid #e0f2f1;}
    .card.past { border-left-color: var(--gray); background: #f8fafc; }
    .card.cancelled { border-left-color: var(--danger); background: #fff5f5; }
    
    #loginOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:9998; align-items:center; justify-content:center; }
    .login-wrapper { position: relative; width: 350px; max-width: 90%; }
    .login-box { background: var(--container-bg); padding: 40px 30px; border-radius: 20px; box-shadow: 0 20px 50px rgba(18, 140, 126, 0.3); text-align: center; position: relative; z-index: 10; border-top: 8px solid var(--primary);}
    .login-box h2 { color: var(--primary); margin-top: 0; margin-bottom: 25px; font-size: 1.8rem; }
    .login-input { width: 100%; padding: 14px; border: 2px solid #b2ebf2; border-radius: 10px; box-sizing: border-box; font-size: 11pt; font-family: 'Nunito', sans-serif; font-weight: 600; color: var(--text-dark);}
    .login-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(18, 140, 126, 0.2); }
    .btn-login { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 13pt; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(18, 140, 126, 0.3); letter-spacing: 1px;}
    .btn-login:hover { background: var(--primary-light); transform: translateY(-2px); }

    #alertOverlay, #overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:999998 !important; backdrop-filter: blur(3px); }
    #alertModal, #modal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:30px; border-radius:20px; z-index:999999 !important; width:320px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); text-align: center; border-top: 8px solid var(--danger);}
    #modal { border-top-color: var(--primary); }
    #alertMessage { font-size: 12pt; font-weight: 700; color: #333; line-height: 1.6; margin-bottom: 20px; white-space: pre-wrap; }
    .btn-alert { background: var(--danger); color: white; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 15px; width: 100%; font-size: 12pt; box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);}
    .confirm-btns { display: flex; gap: 15px; margin-top: 20px; }
    .btn-cancel-modal, .btn-confirm-modal { padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; flex: 1; transition: 0.2s; border: none; font-size: 11pt;}
    .btn-cancel-modal { background: #f1f5f9; color: #64748b; }
    .btn-confirm-modal { background: var(--danger); color: white; box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3); }
    .modal-input { width: 100%; box-sizing: border-box; padding: 12px; margin-top: 8px; margin-bottom: 20px; border: 2px solid #b2ebf2; border-radius: 8px; font-size: 11pt; font-weight: 600; color: var(--primary); }
  </style>
</head>
<body>

<div class="bg-illustration" style="top: 8%; left: 5%; width: 120px; height: 160px; animation-delay: 0s;">
  <svg viewBox="0 0 120 160" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="10" width="100" height="140" rx="8" fill="#1e293b"/><rect x="15" y="20" width="90" height="120" fill="#f8fafc"/><circle cx="60" cy="70" r="30" fill="#60a5fa" opacity="0.6"/><circle cx="80" cy="90" r="25" fill="#f87171" opacity="0.6"/><circle cx="40" cy="100" r="20" fill="#fbbf24" opacity="0.6"/><circle cx="60" cy="145" r="3" fill="#64748b"/></svg>
</div>
<div class="bg-illustration" style="top: 15%; right: 8%; width: 130px; height: 130px; animation-delay: 1.5s; transform: rotate(15deg);">
  <svg viewBox="0 0 140 140" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="30" width="100" height="80" rx="6" fill="#e2e8f0"/><rect x="25" y="35" width="90" height="70" fill="#38bdf8"/><rect x="35" y="55" width="12" height="12" rx="2" fill="#ffffff"/><rect x="55" y="55" width="12" height="12" rx="2" fill="#f43f5e"/><rect x="75" y="55" width="12" height="12" rx="2" fill="#10b981"/><rect x="95" y="55" width="12" height="12" rx="2" fill="#eab308"/><line x1="20" y1="40" x2="25" y2="40" stroke="#94a3b8" stroke-width="2"/><line x1="20" y1="45" x2="25" y2="45" stroke="#94a3b8" stroke-width="2"/></svg>
</div>
<div class="bg-illustration" style="bottom: 12%; left: 8%; width: 140px; height: 140px; animation-delay: 2.5s; transform: rotate(-10deg);">
  <svg viewBox="0 0 160 160" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="20" width="100" height="120" rx="6" fill="#3b82f6"/><rect x="35" y="25" width="90" height="110" fill="#ffffff"/><circle cx="70" cy="60" r="25" fill="#f87171" opacity="0.8"/><circle cx="90" cy="90" r="30" fill="#a3e635" opacity="0.7"/><path d="M 120 40 L 70 110" stroke="#1e40af" stroke-width="6" stroke-linecap="round"/><ellipse cx="123" cy="36" rx="4" ry="6" fill="#1e40af" transform="rotate(35 123 36)"/></svg>
</div>
<div class="bg-illustration" style="bottom: 18%; right: 6%; width: 150px; height: 110px; animation-delay: 0.5s;">
  <svg viewBox="0 0 160 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><polygon points="10,110 30,30 150,30 130,110" fill="#1e3a8a"/><rect x="25" y="35" width="115" height="70" rx="3" fill="#fed7aa" transform="skewX(-14)"/><rect x="50" y="45" width="60" height="40" rx="2" fill="#ffffff" transform="skewX(-14)"/><path d="M 60 70 Q 75 45 90 70 T 110 50" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" transform="skewX(-14)"/><line x1="140" y1="20" x2="105" y2="75" stroke="#64748b" stroke-width="5" stroke-linecap="round"/><rect x="35" y="90" width="8" height="8" rx="2" fill="#3b82f6" transform="skewX(-14)"/><rect x="48" y="90" width="8" height="8" rx="2" fill="#f43f5e" transform="skewX(-14)"/><rect x="61" y="90" width="8" height="8" rx="2" fill="#eab308" transform="skewX(-14)"/></svg>
</div>

<div id="loginOverlay">
  <div class="bg-illustration" style="top: 10%; left: 10%; width: 150px; height: 150px; animation-delay: 1s;"><svg viewBox="0 0 160 160" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="20" width="100" height="120" rx="6" fill="#3b82f6"/><rect x="35" y="25" width="90" height="110" fill="#ffffff"/><circle cx="70" cy="60" r="25" fill="#f87171" opacity="0.8"/><circle cx="90" cy="90" r="30" fill="#a3e635" opacity="0.7"/><path d="M 120 40 L 70 110" stroke="#1e40af" stroke-width="6" stroke-linecap="round"/></svg></div>
  <div class="bg-illustration" style="bottom: 15%; right: 10%; width: 140px; height: 140px; animation-delay: 0.5s; transform: rotate(-20deg);"><svg viewBox="0 0 120 160" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="10" width="100" height="140" rx="8" fill="#1e293b"/><rect x="15" y="20" width="90" height="120" fill="#f8fafc"/><circle cx="60" cy="70" r="30" fill="#60a5fa" opacity="0.6"/><circle cx="80" cy="90" r="25" fill="#f87171" opacity="0.6"/><circle cx="40" cy="100" r="20" fill="#fbbf24" opacity="0.6"/></svg></div>

  <div class="login-wrapper">
    <div class="login-box">
      <h2>設備預約登入</h2>
      <select id="loginNameSelect" class="login-input" style="margin-bottom: 20px;"><option value="">載入名單中...</option></select>
      <input type="text" id="loginPinInput" class="login-input" placeholder="請輸入帳號" style="margin-bottom: 10px;">
      <div style="font-size: 10pt; color: #555; text-align: left; margin-bottom: 25px; line-height: 1.5; background: #e0f7fa; padding: 12px; border-radius: 10px; border: 2px dashed #b2ebf2; font-weight: 600;">
        💡 請輸入你的 <b>mail.chanes.tc.edu.tw</b> 帳號<br>
        <span style="font-size: 9pt; color: #777;">(只需輸入 @ 前的帳號即可)</span>
      </div>
      <button id="btnLoginSubmit" class="btn-login" onclick="doLogin()">Login 登入</button>
    </div>
  </div>
</div>

<div id="mainApp" style="display:none;">
  <div class="app-wrapper">
    <div class="wavy-top"></div>
    <div class="main-content">
      <div class="app-header">
        <h1 class="app-title">Lab Equipment 💻</h1>
        <div class="header-user">
          <span id="displayUserName">使用者</span>
          <button class="btn-logout" onclick="doLogout(false)">登出</button>
        </div>
        <div class="app-nav" style="width: 100%;">
          <div class="nav-item active" onclick="switchAppView('booking')" id="nav-booking">📝 我要預約</div>
          <div class="nav-item" onclick="switchAppView('myrecords')" id="nav-myrecords">👤 我的紀錄</div>
          <div class="nav-item admin-nav" onclick="switchAppView('admin')" id="nav-admin">⚙️ 管理後台</div>
        </div>
      </div>

      <div id="proxyAlert" class="proxy-alert">
        <span style="font-size: 1.5rem;">🔄</span>
        <span><b>代理模式：</b>您正以「<span id="proxyCurrentName" style="color:#d35400; text-decoration:underline;"></span>」身分操作。</span>
      </div>

      <!-- Booking View -->
      <div id="view-booking" class="view-section active">
        <div id="adminPanel" class="admin-panel" style="display:none;">
          <h3>👨‍💻 代客預約 / 身分切換</h3>
          <div class="admin-controls" style="display:flex; gap:10px;">
            <select id="adminSwitchName" class="admin-input"></select>
            <button id="btnSwitch" class="btn-admin-active" onclick="switchUserProxy()">切換</button>
            <button id="btnReset" class="btn-admin-inactive" onclick="resetUserProxy()">還原本人</button>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h2 style="margin:0;">選擇借用時段 <span id="syncTag" style="font-size:11pt; color:var(--primary); font-weight:bold;"></span></h2>
        </div>

        <div id="dailyBoard" class="daily-board" style="display:none;"></div>

        <div class="booking-controls">
          <div>
            <label>📅 借用日期</label>
            <input type="date" id="targetDate" onchange="refreshBooking()">
          </div>
          <div>
            <label>💻 選擇設備/教室</label>
            <select id="itemSelect" onchange="refreshBooking()"></select>
          </div>
        </div>
        <div id="tableBox" style="overflow-x:auto;"></div>
      </div>

      <!-- My Records View -->
      <div id="view-myrecords" class="view-section">
        <h2 style="margin-top: 0; margin-bottom: 25px;">預約清單</h2>
        <div class="tabs">
          <div id="tab-upcoming" class="tab active" onclick="switchSubTab('upcoming')">即將到來</div>
          <div id="tab-past" class="tab" onclick="switchSubTab('past')">歷史紀錄</div>
        </div>
        <div id="list-upcoming"></div>
        <div id="list-past" style="display: none;"></div>
      </div>

      <!-- Admin View -->
      <div id="view-admin" class="view-section">
        <h2 style="color:var(--admin-purple); margin-top:0;">👨‍‍💻 管理員看板</h2>
        <div class="tabs" style="border-bottom-color: #b2dfdb;">
          <div id="admin-t1" class="tab active" onclick="switchAdminTab(1)" style="background:var(--admin-purple); color:white; border-color:var(--admin-purple);">每日狀態</div>
          <div id="admin-t2" class="tab" onclick="switchAdminTab(2)">禁借設定</div>
          <div id="admin-t3" class="tab" onclick="switchAdminTab(3)">統計圖表</div>
        </div>
        <div id="admin-page1">
          <div style="background:#e0f2f1; padding:20px; border-radius:12px; margin-bottom:15px; display:flex; gap:15px; align-items:center;">
            <label style="font-weight:bold;">📅 查看日期</label>
            <input type="date" id="adminDate" onchange="loadAdminDaily()" style="padding:10px; border-radius:8px; border:1px solid #80cbc4; flex-grow:1; max-width:250px;">
          </div>
          <div id="adminDailyList"></div>
        </div>
        <div id="admin-page2" style="display:none;">
           <!-- 批次設定表單省略樣式，共用主樣式 -->
           <div style="background:#e0f2f1; padding:20px; border-radius:12px;">
             <p style="color:#00695c; font-weight:bold;">⚠️ 請至原本試算表設定，或參考舊版表單介面</p>
           </div>
        </div>
        <div id="admin-page3" style="display:none;">
          <div style="position: relative; height: 350px; width: 100%; background:white; padding:20px; border-radius:10px; border: 1px solid #b2dfdb;"><canvas id="myChart"></canvas></div>
        </div>
      </div>
    </div>
    <div class="wavy-bottom"></div>
  </div>
</div>

<div id="overlay" onclick="closeModal()"></div>
<div id="modal">
  <h3 style="color:var(--primary); margin-top:0;">確認預約</h3>
  <div id="confirmDetail" style="font-size:11pt; background:#e0f7fa; padding:15px; border-radius:10px; margin-bottom:20px; line-height:1.6; border: 2px dashed #b2ebf2; color: var(--primary);"></div>
  <label style="font-size: 11pt; font-weight:bold; color: var(--primary);">👤 借用人</label>
  <input type="text" id="userName" class="modal-input" readonly style="background:#f1f5f9; color:#64748b; border-style: dashed;">
  <label style="font-size: 11pt; font-weight:bold; color: var(--primary);">📝 用途</label>
  <select id="purposeType" class="modal-input" onchange="togglePurpose()">
    <option value="class">班級使用</option><option value="other">其他用途</option>
  </select>
  <div id="classDiv"><select id="classSelect" class="modal-input"></select></div>
  <div id="otherDiv" style="display:none;"><input type="text" id="otherPurpose" class="modal-input" placeholder="請輸入用途"></div>
  <button onclick="submitBooking()" style="width:100%; padding:14px; background:var(--primary); color:white; border:none; border-radius:10px; cursor:pointer; font-weight:bold; font-size:12pt; box-shadow: 0 4px 10px rgba(18, 140, 126, 0.4);">送出預約</button>
</div>

<div id="alertOverlay"></div>
<div id="alertModal">
  <div id="alertMessage"></div>
  <div id="alertBtns"></div>
</div>

<script>
  // ================= 核心：API 呼叫封裝 (強化錯誤捕捉) =================
  // ⚠️ 請確保此處為最新發佈（且權限為所有人）的 Google Apps Script 網址
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbydeXYEg9dgAKB_FsAomg37crRb9OJER4w-Fm2c7fy6uOPv8CeyhW37JV9_OnrFyB-M/exec"; 

  const AppAPI = {
    async call(action, payload = {}) {
      if(GAS_API_URL.includes("在此貼上")) {
        showSystemAlert("⚠️ 錯誤：\n請先在 HTML 原始碼中設定 \nGAS_API_URL！");
        return Promise.reject("URL not set");
      }
      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: action, payload: payload })
        });
        
        // 先以字串讀取，防止 GAS 回傳 HTML 登入畫面導致 JSON.parse 壞掉
        const text = await response.text(); 
        let data;
        try {
          data = JSON.parse(text);
        } catch(err) {
          console.error("API 回傳非 JSON 格式:\n", text);
          throw new Error("伺服器回傳格式異常。\n\n這通常代表您的 GAS API 網址尚未將權限設定為「所有人(Anyone)」，導致 Google 強制攔截連線要求登入。");
        }

        if (data && data.error) throw new Error(data.error);
        return data;

      } catch (error) {
        console.error(`API 呼叫失敗 [${action}]:`, error);
        throw error;
      }
    }
  };

  // ================= 自訂警告視窗 (保證在最上層) =================
  let confirmCallback = null;
  function showSystemConfirm(msg, callback) {
    document.getElementById('alertMessage').innerText = msg;
    document.getElementById('alertBtns').innerHTML = `<div class="confirm-btns"><button class="btn-cancel-modal" onclick="closeSystemAlert()">取消</button><button class="btn-confirm-modal" onclick="executeConfirm()">確定</button></div>`;
    confirmCallback = callback;
    document.getElementById('alertOverlay').style.display = 'block'; document.getElementById('alertModal').style.display = 'block';
  }
  function executeConfirm() { closeSystemAlert(); if(confirmCallback) confirmCallback(); }
  function showSystemAlert(msg) {
    document.getElementById('alertMessage').innerText = msg;
    document.getElementById('alertBtns').innerHTML = `<button class="btn-alert" onclick="closeSystemAlert()">確定</button>`;
    document.getElementById('alertOverlay').style.display = 'block'; document.getElementById('alertModal').style.display = 'block';
  }
  function closeSystemAlert() { document.getElementById('alertOverlay').style.display = 'none'; document.getElementById('alertModal').style.display = 'none'; }


  // ================= 全域變數與狀態 =================
  let staticData = { items: [], classes: [], periods: [], users: [], userInfo: null };
  let originalAdminName = ""; let originalAdminEmail = ""; let spoofedUserName = ""; 
  let currentSel = {}; let allMyRecords = []; 
  const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
  let bookingRequestSerial = 0;

  function getLocalTodayString() {
    const now = new Date();
    const offset = now.getTimezoneOffset() * 60000;
    return (new Date(now - offset)).toISOString().split('T')[0];
  }

  // ================= 初始化與登入系統 =================
  function renderLoginNameSelect(users) {
    const nameSel = document.getElementById('loginNameSelect');
    const currentVal = nameSel.value;
    nameSel.innerHTML = '<option value="">-- 請選擇您的姓名 --</option>' + users.map(u => `<option value="${u.name}">${u.name}</option>`).join('');
    if (currentVal) nameSel.value = currentVal;
  }

  window.onload = () => {
    const today = getLocalTodayString();
    document.getElementById('targetDate').value = today;

    const savedUser = localStorage.getItem('appAuthSession');
    if (savedUser) {
      staticData.userInfo = JSON.parse(savedUser);
      initSPA();
    } else {
      document.getElementById('loginOverlay').style.display = 'flex';
      const localUsers = localStorage.getItem('localUserList_v2');
      if (localUsers) { renderLoginNameSelect(JSON.parse(localUsers)); }
      
      AppAPI.call('getLoginUserList').then(users => {
        if(users && users.length > 0) {
           localStorage.setItem('localUserList_v2', JSON.stringify(users));
           if (!localUsers) renderLoginNameSelect(users); 
        }
      }).catch(err => {
          showSystemAlert("⚠️ 取得名單失敗：\n" + err.message);
      });
    }
  };

  function doLogin() {
    const name = document.getElementById('loginNameSelect').value;
    const pin = document.getElementById('loginPinInput').value;
    if(!name || !pin) { showSystemAlert("⚠️ 請選擇姓名並輸入帳號！"); return; }
    
    const btn = document.getElementById('btnLoginSubmit');
    btn.innerText = "驗證中..."; btn.disabled = true;

    AppAPI.call('verifyLogin', { name, pin }).then(res => {
         if(res.success) {
            const authData = { name: res.name, email: res.email, isAdmin: res.isAdmin };
            localStorage.setItem('appAuthSession', JSON.stringify(authData));
            staticData.userInfo = authData;
            btn.innerText = "Login 登入"; btn.disabled = false;
            initSPA();
         } else {
            showSystemAlert("❌ 登入失敗：\n" + res.msg);
            btn.innerText = "Login 登入"; btn.disabled = false;
         }
      }).catch(err => {
         showSystemAlert("🚫 連線錯誤！\n\n原因：" + err.message);
         btn.innerText = "Login 登入"; btn.disabled = false;
      });
  }

  function doLogout() {
    localStorage.removeItem('appAuthSession');
    document.getElementById('mainApp').style.display = 'none';
    document.getElementById('loginOverlay').style.display = 'flex';
    document.getElementById('loginPinInput').value = '';
  }

  function initSPA() {
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';

    document.getElementById('displayUserName').innerText = staticData.userInfo.name;
    document.getElementById('userName').value = staticData.userInfo.name;
    
    const isUserAdmin = staticData.userInfo.isAdmin === true || staticData.userInfo.isAdmin === 'true';
    if (isUserAdmin) {
      document.getElementById('nav-admin').style.display = 'inline-block';
      document.getElementById('adminPanel').style.display = 'block';
      if (!originalAdminName) { originalAdminName = staticData.userInfo.name; originalAdminEmail = staticData.userInfo.email; }
    } else {
      document.getElementById('nav-admin').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'none';
    }

    toggleLoadingState(true); renderSkeleton();
    
    AppAPI.call('getAppStartupData', { email: staticData.userInfo.email, targetDate: document.getElementById('targetDate').value }).then(data => {
      if (data && data.staticData) {
        if(data.staticData.items) staticData.items = data.staticData.items;
        if(data.staticData.classes) staticData.classes = data.staticData.classes;
        if(data.staticData.periods) staticData.periods = data.staticData.periods;
        if(data.staticData.users) staticData.users = data.staticData.users; 
      }
      initDropdowns();
      
      if(data && data.bookingStatus) {
        renderDailyBoard(data.bookingStatus); renderTable(data.bookingStatus);
        document.getElementById('syncTag').innerText = ""; toggleLoadingState(false);
      } else { refreshBooking(); }
    }).catch(err => {
       showSystemAlert("系統連線發生錯誤，無法載入初始資料。"); toggleLoadingState(false);
    });
  }

  // ================= UI 互動與排版邏輯 =================
  function switchAppView(viewId) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.getElementById('nav-' + viewId).classList.add('active');
    document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
    document.getElementById('view-' + viewId).classList.add('active');

    if (viewId === 'booking') refreshBooking();
    else if (viewId === 'myrecords') loadMyRecordsData();
  }

  function initDropdowns() {
    const itemSel = document.getElementById('itemSelect');
    if(staticData.items.length > 0) { itemSel.innerHTML = staticData.items.map(i => `<option value="${i}">${i}</option>`).join(''); }
    const classSel = document.getElementById('classSelect');
    if(staticData.classes.length > 0) { classSel.innerHTML = staticData.classes.map(c => `<option value="${c}">${c}</option>`).join(''); }
    const adminSwitchSel = document.getElementById('adminSwitchName');
    if(staticData.users.length > 0) { adminSwitchSel.innerHTML = staticData.users.map(u => `<option value="${u.email}">${u.name}</option>`).join(''); }
    adminSwitchSel.value = spoofedUserName === "" ? originalAdminEmail : staticData.userInfo.email;
  }

  function toggleLoadingState(isLoading) {
    const dateInput = document.getElementById('targetDate'); const itemInput = document.getElementById('itemSelect');
    dateInput.disabled = isLoading; itemInput.disabled = isLoading;
    if(isLoading) { dateInput.classList.add('locked-input'); itemInput.classList.add('locked-input'); } 
    else { dateInput.classList.remove('locked-input'); itemInput.classList.remove('locked-input'); }
  }

  function renderSkeleton() {
    let h = `<table><tr><th style="width:100px;">節次</th>${'<th>讀取中</th>'.repeat(5)}</tr>`;
    const pList = staticData.periods.length > 0 ? staticData.periods : [{name:'載入中'}];
    pList.forEach(p => { h += `<tr><td style="font-weight:bold;">${p.name}</td>${'<td><div class="skeleton"></div></td>'.repeat(5)}</tr>`; });
    document.getElementById('tableBox').innerHTML = h + "</table>";
  }

  function refreshBooking() {
    const targetDate = document.getElementById('targetDate').value;
    const targetItem = document.getElementById('itemSelect').value;
    if(!targetDate || !targetItem) return;

    const requestSerial = ++bookingRequestSerial;
    document.getElementById('syncTag').innerText = "(同步中...)";
    toggleLoadingState(true); renderSkeleton(); document.getElementById('dailyBoard').style.display = 'none';
    
    AppAPI.call('getBookingStatus', { targetDate, selectedItem: targetItem }).then(status => {
        if (requestSerial !== bookingRequestSerial) return;
        renderDailyBoard(status); renderTable(status);
        document.getElementById('syncTag').innerText = ""; toggleLoadingState(false);
      }).catch(err => {
        if (requestSerial !== bookingRequestSerial) return;
        document.getElementById('syncTag').innerText = "(同步失敗)"; toggleLoadingState(false);
      });
  }

  function renderDailyBoard(status) {
    const board = document.getElementById('dailyBoard');
    const tDate = document.getElementById('targetDate').value;
    if (status.dailyAll && status.dailyAll.length > 0) {
      let boardHtml = `<h3>📌 日期 (${tDate}) 總狀態</h3><div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px;">`;
      staticData.periods.forEach(p => {
        const recordsInPeriod = status.dailyAll.filter(r => r.period === p.name);
        if (recordsInPeriod.length > 0) {
          const tags = recordsInPeriod.map(r => `<div class="daily-tag">${r.item} (${r.user})</div>`).join('');
          boardHtml += `<div style="display: flex; align-items: flex-start; gap: 10px; border-bottom: 1px dashed #dcedc8; padding-bottom: 10px;"><div style="font-weight: bold; color: #558b2f; width: 60px; flex-shrink: 0; margin-top: 5px;">${p.name}</div><div class="daily-tags" style="margin: 0;">${tags}</div></div>`;
        }
      });
      board.innerHTML = boardHtml + `</div>`;
    } else {
      board.innerHTML = `<h3>📌 日期 (${tDate}) 總狀態</h3><div style="color:#888; font-size:10pt;">該日尚無預約紀錄</div>`;
    }
    board.style.display = 'block';
  }

  function renderTable(status) {
    if (!status.weekDates || status.weekDates.length === 0) return;
    let h = `<table><tr><th style="width:100px;">節次</th>`;
    status.weekDates.forEach(d => {
      const dayIdx = new Date(d.replace(/-/g, '/')).getDay();
      h += `<th style="${(dayIdx===0||dayIdx===6)?'color: var(--danger);':''}">${d.slice(5)}<br><span style="font-size:10pt; font-weight:normal;">(${dayNames[dayIdx]})</span></th>`;
    });
    h += `</tr>`;
    
    const nowTs = Date.now(); 
    staticData.periods.forEach(p => {
      h += `<tr><td style="font-weight:bold; background:#f8fafc; color:#555;">${p.name}</td>`;
      status.weekDates.forEach(d => {
        let periodEndTs = p.end ? new Date(d.replace(/-/g, '/') + ' ' + p.end).getTime() : nowTs + 9999999;
        const isB = status.records.find(r => r.date === d && r.period === p.name);
        const isR = status.restrictions.find(r => r.date === d && r.period === p.name);
        
        if (isR) h += `<td class="cell-restricted">🔒 ${isR.note || '禁借'}</td>`;
        else if (isB) {
          const currentEmail = String(staticData.userInfo.email || '').trim().toLowerCase();
          const bookedEmail = String(isB.email || '').trim().toLowerCase();
          const isMe = bookedEmail ? bookedEmail === currentEmail : isB.user === staticData.userInfo.name;
          h += `<td><span class="${isMe?'cell-mine':'cell-booked'}">${isMe?'本人預約':isB.user}</span></td>`;
        } 
        else if (periodEndTs < nowTs) h += `<td><span class="cell-past">已過期</span></td>`;
        else h += `<td><button class="btn-book" onclick="openModal('${d}','${p.name}')">預約</button></td>`;
      });
      h += `</tr>`;
    });
    document.getElementById('tableBox').innerHTML = h + "</table>";
  }

  function openModal(d, p) {
    currentSel = { d, p, item: document.getElementById('itemSelect').value };
    document.getElementById('confirmDetail').innerHTML = `借用日期：<b>${d}</b><br>節次：<b>${p}</b><br>設備：<b>${currentSel.item}</b>`;
    document.getElementById('overlay').style.display = 'block'; document.getElementById('modal').style.display = 'block';
  }
  function closeModal() { document.getElementById('overlay').style.display = 'none'; document.getElementById('modal').style.display = 'none'; }
  function togglePurpose() {
    const isOther = document.getElementById('purposeType').value === 'other';
    document.getElementById('classDiv').style.display = isOther ? 'none' : 'block';
    document.getElementById('otherDiv').style.display = isOther ? 'block' : 'none';
  }

  function submitBooking() {
    const pVal = document.getElementById('purposeType').value === 'class' ? document.getElementById('classSelect').value : document.getElementById('otherPurpose').value;
    const btn = document.querySelector('#modal button');
    btn.innerText = "⏳ 處理中..."; btn.disabled = true;

    AppAPI.call('submitBooking', { date: currentSel.d, period: currentSel.p, item: currentSel.item, user: staticData.userInfo.name, email: staticData.userInfo.email, purpose: pVal })
      .then((res) => {
        btn.innerText = "送出預約"; btn.disabled = false; closeModal();
        if (res && res.success) { showSystemAlert("✅ 預約成功！"); refreshBooking(); } 
        else { showSystemAlert(res ? res.msg : "發生錯誤"); refreshBooking(); }
      }).catch(err => {
        btn.innerText = "送出預約"; btn.disabled = false; closeModal(); showSystemAlert("連線錯誤，預約失敗: " + err.message);
      });
  }

  // ================= 我的紀錄區塊 =================
  function loadMyRecordsData() {
    const upBox = document.getElementById('list-upcoming');
    upBox.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    document.getElementById('list-past').innerHTML = '';
    
    AppAPI.call('getMyRecords', { email: staticData.userInfo.email }).then(records => {
      allMyRecords = records; renderRecordLists();
    }).catch(err => showSystemAlert("載入紀錄失敗：" + err.message));
  }

  function renderRecordLists() {
    const nowTs = Date.now();
    let upcoming = [], pastEnded = [], pastCancelled = [];
    allMyRecords.forEach(r => {
      if (r.purpose === '已取消') { pastCancelled.push(r); return; }
      let isPast = false;
      const pInfo = staticData.periods.find(p => p.name === r.period);
      if (pInfo && pInfo.end) { if (nowTs > new Date(r.date.replace(/-/g, '/') + ' ' + pInfo.end).getTime()) isPast = true; } 
      else { if (r.date < getLocalTodayString()) isPast = true; }
      if (isPast) pastEnded.push(r); else upcoming.push(r);
    });

    upcoming.sort((a, b) => a.date.localeCompare(b.date));
    pastEnded.sort((a, b) => b.date.localeCompare(a.date));
    
    const upBox = document.getElementById('list-upcoming');
    upBox.innerHTML = upcoming.length ? upcoming.map(r => createRecordCard(r, true)).join('') : '<div style="text-align:center; padding:30px; color:#999; background:#fff; border-radius:8px; border:2px dashed #b2ebf2;">目前沒有即將到來的預約 🎉</div>';
    
    const pastBox = document.getElementById('list-past');
    if (pastEnded.length === 0 && pastCancelled.length === 0) {
      pastBox.innerHTML = '<div style="text-align:center; padding:30px; color:#999; background:#fff; border-radius:8px; border:2px dashed #b2ebf2;">目前沒有歷史紀錄</div>';
    } else {
      pastBox.innerHTML = (pastEnded.length > 0 ? `<div style="font-weight:bold; margin:20px 0 10px 0; color:var(--gray);">☑️ 已結束</div>` + pastEnded.map(r => createRecordCard(r, false)).join('') : '') +
                          (pastCancelled.length > 0 ? `<div style="font-weight:bold; margin:20px 0 10px 0; color:var(--danger);">🚫 已取消</div>` + pastCancelled.map(r => createRecordCard(r, false)).join('') : '');
    }
  }

  function createRecordCard(r, isUpcoming) {
    const isCancelled = r.purpose === '已取消';
    let cardClass = isCancelled ? 'card cancelled' : (isUpcoming ? 'card' : 'card past');
    let actionHtml = isCancelled ? `<div class="status-badge" style="background:#ffebee; color:#e74c3c;">已取消</div>` : (isUpcoming ? `<button class="btn-cancel" onclick="cancelUserRecord(${r.rowId}, this)">取消預約</button>` : `<div style="color:#95a5a6; font-style:italic;">已結束</div>`);
    return `<div class="${cardClass}"><div class="info"><div class="title">📅 ${r.date} &nbsp;|&nbsp; ⏱️ ${r.period}</div><div class="detail">設備/教室：<span>${r.item}</span><br>預約用途：${r.purpose !== '已取消' ? r.purpose : '--'}</div></div><div>${actionHtml}</div></div>`;
  }

  function switchSubTab(tab) {
    document.getElementById('list-upcoming').style.display = tab === 'upcoming' ? 'block' : 'none';
    document.getElementById('list-past').style.display = tab === 'past' ? 'block' : 'none';
    document.getElementById('tab-upcoming').className = tab === 'upcoming' ? 'tab active' : 'tab';
    document.getElementById('tab-past').className = tab === 'past' ? 'tab active' : 'tab';
  }

  function cancelUserRecord(rowId, btnElement) {
    showSystemConfirm("⚠️ 確定要取消這筆預約嗎？", () => {
      btnElement.innerText = "⏳ 取消中..."; btnElement.disabled = true;
      AppAPI.call('cancelBooking', { rowId: rowId }).then(() => {
        showSystemAlert("✅ 預約已成功取消！"); loadMyRecordsData(); 
      }).catch(err => showSystemAlert("取消失敗: " + err.message));
    });
  }

  // Proxy / Admin features logic reduced to fit single file cleanly
  function switchUserProxy() {
    const sel = document.getElementById('adminSwitchName');
    const newEmail = sel.value; const newName = sel.options[sel.selectedIndex].text;
    if (!newEmail || newEmail === originalAdminEmail) { resetUserProxy(); return; }
    spoofedUserName = newName; staticData.userInfo.name = newName; staticData.userInfo.email = newEmail; 
    document.getElementById('proxyCurrentName').innerText = newName; document.getElementById('proxyAlert').style.display = 'flex';
    document.getElementById('displayUserName').innerText = newName;
    showSystemAlert(`✅ 已切換為代理模式！\n操作將屬於「${newName}」。`);
    if(document.getElementById('view-booking').classList.contains('active')) refreshBooking();
  }
  function resetUserProxy() {
    if (!originalAdminName) return;
    spoofedUserName = ""; staticData.userInfo.name = originalAdminName; staticData.userInfo.email = originalAdminEmail;
    document.getElementById('adminSwitchName').value = originalAdminEmail;
    document.getElementById('proxyAlert').style.display = 'none';
    document.getElementById('displayUserName').innerText = originalAdminName;
    showSystemAlert(`🔄 已還原為管理員本人。`);
    if(document.getElementById('view-booking').classList.contains('active')) refreshBooking();
  }

</script>
</body>
</html>
